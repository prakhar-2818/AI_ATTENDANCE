<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance History | FaceAttend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--sky:#0ea5e9;--sky-d:#0284c7;--teal:#009688;--dark:#1f2937;--ink:#111827;--mute:#6b7280;--line:#e5e7eb;--bg:#f1f5f9;--green:#16a34a;--red:#dc2626;--yellow:#facc15;--r:16px;--sh:0 1px 2px rgba(15,23,42,.04),0 6px 20px rgba(15,23,42,.06)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Plus Jakarta Sans",Arial,Helvetica,sans-serif;background:var(--bg);color:#222;min-height:100vh;display:flex;flex-direction:column;
background-image:radial-gradient(900px 380px at 85% -80px,rgba(14,165,233,.14),transparent 70%),radial-gradient(700px 320px at 10% -60px,rgba(0,150,136,.10),transparent 70%);background-repeat:no-repeat}

/* header */
.top-header{height:68px;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:fixed;inset:0 0 auto 0;z-index:1000}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#38bdf8,var(--sky-d));display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:800;box-shadow:0 6px 14px rgba(14,165,233,.35)}
.brand-name{font-size:21px;font-weight:800;color:var(--ink);letter-spacing:-.3px}
.brand-name span{color:var(--sky)}
.top-right{display:flex;align-items:center;gap:14px}
.welcome-text{font-size:14px;color:#374151}
.welcome-text strong{color:var(--red)}
.profile-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--sky),var(--teal));display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}

/* sidebar */
.sidebar{position:fixed;top:68px;left:0;bottom:0;width:76px;background:var(--dark);z-index:900;display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:8px}
.side-item{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#d1d5db;text-decoration:none;font-size:21px;cursor:pointer;position:relative;transition:.2s}
.side-item:hover{background:#374151;color:#fff;transform:translateX(2px)}
.side-item.active{background:var(--yellow);color:var(--ink);box-shadow:0 6px 16px rgba(250,204,21,.35)}
.side-item.active::before{content:"";position:absolute;left:-13px;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--yellow)}
.side-item[title]:hover::after{content:attr(title);position:absolute;left:62px;background:var(--ink);color:#fff;font-size:12px;padding:5px 10px;border-radius:8px;white-space:nowrap;pointer-events:none;z-index:5}
.side-bottom{margin-top:auto}

/* main - fits the screen */
.main{margin-left:76px;padding:68px 0 0;flex:1;display:flex;flex-direction:column;min-width:0}
.content{padding:24px 28px 20px;height:calc(100vh - 68px);min-height:520px;display:flex;flex-direction:column;gap:16px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:8px;flex:none}
.page-title{font-size:26px;font-weight:800;color:var(--ink);letter-spacing:-.5px}
.page-sub{font-size:13.5px;color:var(--mute);margin-top:2px}
.count-chip{font-size:13px;font-weight:700;color:var(--sky-d);background:#e0f2fe;padding:8px 14px;border-radius:30px}

.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;flex:1;min-height:0;position:relative;animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.panel::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--sky),var(--teal))}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.filters{display:flex;gap:10px;padding:18px;border-bottom:1px solid #f0f2f5;flex:none;flex-wrap:wrap;align-items:center}
.filters label{font-size:13px;font-weight:700;color:var(--teal);margin-right:4px}
.filters select{height:40px;padding:0 14px;background:#f9fafb;border:1px solid #d1d5db;border-radius:30px;color:#1f2937;font-family:inherit;font-size:13.5px;font-weight:600;outline:none;min-width:200px;cursor:pointer;transition:.2s}
.filters select:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(14,165,233,.15);background:#fff}
.btn{height:40px;padding:0 24px;border:0;border-radius:30px;background:linear-gradient(135deg,#38bdf8,var(--sky-d));color:#fff;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 6px 14px rgba(14,165,233,.3);transition:.2s}
.btn:hover{transform:translateY(-2px)}

#table{flex:1;min-height:0;overflow:auto;padding:0 18px 18px}
.table{width:100%;border-collapse:collapse}
.table tr:first-child{background:#343434;color:#fff;position:sticky;top:0;z-index:1}
.table th{padding:12px;text-align:left;font-size:12.5px;font-weight:600;white-space:nowrap}
.table th:first-child{border-radius:12px 0 0 12px}.table th:last-child{border-radius:0 12px 12px 0}
.table td{padding:12px;border-bottom:1px solid #eef0f3;font-size:13.5px}
.table tr:nth-child(even) td{background:#f8f9fb}
.table tr:not(:first-child):hover td{background:#e0f2fe}
.subject-tag{display:inline-block;background:#e0f2fe;color:var(--sky-d);font-weight:700;font-size:12.5px;padding:3px 11px;border-radius:20px}
.success,.danger{font-weight:700}
.success{color:var(--green)}
.danger{color:var(--red)}
.success::before,.danger::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;background:currentColor}
.empty{text-align:center;padding:60px 10px;color:#9ca3af;font-size:14px}

::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px}
:focus-visible{outline:3px solid rgba(14,165,233,.5);outline-offset:2px}

@media(max-width:750px){
.top-header{padding:0 12px}.brand-name,.welcome-text{display:none}
.sidebar{width:56px}.side-item{width:42px;height:42px}.main{margin-left:56px}
.content{padding:16px 14px;height:auto}.panel{min-height:420px}
.filters select{flex:1;min-width:0}.page-title{font-size:22px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="top-header">
  <div class="brand">
    <div class="brand-logo">F</div>
    <div class="brand-name">Face<span>Attend</span></div>
  </div>
  <div class="top-right">
    <div class="welcome-text">Welcome <strong id="topName">Student</strong></div>
    <div class="profile-avatar" id="profileAvatar">S</div>
  </div>
</header>

<aside class="sidebar">
  <a class="side-item" href="dashboard.html" title="Dashboard">▦</a>
  <a class="side-item active" href="history.html" title="Attendance History">📊</a>
  <div class="side-bottom"><a class="side-item" onclick="logout()" title="Logout">⚙</a></div>
</aside>

<main class="main">
<div class="content">

  <div class="page-head">
    <div>
      <div class="page-title">Attendance History</div>
      <div class="page-sub">Your complete attendance record</div>
    </div>
    <div class="count-chip" id="countChip">0 records</div>
  </div>

  <div class="panel">
    <div class="filters">
      <label for="subject">Subject</label>
      <select id="subject" onchange="loadHistory()">
        <option value="">All Subjects</option>
        <option>ADB</option>
        <option>DE</option>
        <option>DL</option>
        <option>TOC</option>
        <option>SOFT_SKILL</option>
        <option>APTITUDE</option>
        <option>PS_LAB</option>
        <option>SEDP</option>
        <option>SEDP_LAB</option>
      </select>
      <button class="btn" onclick="loadHistory()">Filter</button>
    </div>
    <div id="table"><div class="empty">Loading records...</div></div>
  </div>

</div>
</main>

<script>
const API = "http://localhost:5000/api";
const token = localStorage.getItem("token");
const user = JSON.parse(localStorage.getItem("user") || "null");

if (!token || !user || user.role !== "student") {
    location.href = "login.html";
}

function logout() {
    localStorage.clear();
    location.href = "login.html";
}

(function () {
    const name = (user && user.name) || "Student";
    document.getElementById("topName").textContent = name;
    document.getElementById("profileAvatar").textContent = name.charAt(0).toUpperCase();
})();

async function loadHistory() {
    try {
        const response = await fetch(API + "/attendance/student/" + encodeURIComponent(user.userId), {
            headers: { Authorization: "Bearer " + token }
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message);

        let records = data.attendance;
        const subject = document.getElementById("subject").value;
        if (subject) {
            records = records.filter(record => record.subject === subject);
        }

        const container = document.getElementById("table");
        document.getElementById("countChip").textContent = records.length + (records.length === 1 ? " record" : " records");

        if (records.length === 0) {
            container.innerHTML = `<div class="empty">No records found.</div>`;
            return;
        }

        container.innerHTML = `
            <table class="table">
                <tr>
                    <th>Subject</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Status</th>
                </tr>
                ${records.map(record => `
                    <tr>
                        <td><span class="subject-tag">${record.subject}</span></td>
                        <td>${record.date}</td>
                        <td>${record.time}</td>
                        <td class="${record.status === "Absent" ? "danger" : "success"}">${record.status}</td>
                    </tr>`).join("")}
            </table>`;
    } catch (error) {
        alert(error.message);
    }
}

loadHistory();
</script>
</body>
</html>
