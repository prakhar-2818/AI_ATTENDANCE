<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar | FaceAttend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--sky:#0ea5e9;--sky-d:#0284c7;--teal:#009688;--dark:#1f2937;--ink:#111827;--mute:#6b7280;--line:#e5e7eb;--bg:#f1f5f9;--green:#16a34a;--red:#dc2626;--yellow:#facc15;--r:16px;--sh:0 1px 2px rgba(15,23,42,.04),0 6px 20px rgba(15,23,42,.06)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Plus Jakarta Sans",Arial,Helvetica,sans-serif;background:var(--bg);color:#222;display:flex;flex-direction:column;min-height:100vh;
background-image:radial-gradient(900px 380px at 85% -80px,rgba(14,165,233,.14),transparent 70%),radial-gradient(700px 320px at 10% -60px,rgba(0,150,136,.10),transparent 70%);background-repeat:no-repeat}

/* header */
.top-header{height:68px;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:fixed;inset:0 0 auto 0;z-index:1000}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#38bdf8,var(--sky-d));display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:800;box-shadow:0 6px 14px rgba(14,165,233,.35)}
.brand-name{font-size:21px;font-weight:800;color:var(--ink);letter-spacing:-.3px}
.brand-name span{color:var(--sky)}
.top-right{display:flex;align-items:center;gap:14px}
.top-icon{width:40px;height:40px;border-radius:12px;background:#f3f4f6;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;transition:.2s;position:relative}
.top-icon:hover{background:#e0f2fe;transform:translateY(-1px)}
.top-icon.dot::after{content:"";position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid #fff}
.welcome-text{font-size:14px;color:#374151;padding:0 6px}
.welcome-text strong{color:var(--red)}
.profile{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:30px;background:#f3f4f6;font-size:11px;color:var(--mute)}
.profile-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--sky),var(--teal));display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:15px}

/* sidebar */
.sidebar{position:fixed;top:68px;left:0;bottom:0;width:76px;background:var(--dark);z-index:900;display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:8px}
.side-item{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#d1d5db;text-decoration:none;font-size:21px;cursor:pointer;position:relative;transition:.2s}
.side-item:hover{background:#374151;color:#fff;transform:translateX(2px)}
.side-item.active{background:var(--yellow);color:var(--ink);box-shadow:0 6px 16px rgba(250,204,21,.35)}
.side-item.active::before{content:"";position:absolute;left:-13px;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--yellow)}
.side-item[title]:hover::after{content:attr(title);position:absolute;left:62px;background:var(--ink);color:#fff;font-size:12px;padding:5px 10px;border-radius:8px;white-space:nowrap;pointer-events:none}
.side-bottom{margin-top:auto}

/* main */
.main{margin-left:76px;padding-top:68px;flex:1;display:flex;flex-direction:column;min-width:0}
.content{flex:1;padding:24px 28px 8px;width:100%}
.page-head{margin-bottom:20px}
.page-title{font-size:28px;font-weight:800;color:var(--ink);letter-spacing:-.5px}
.page-sub{font-size:13.5px;color:var(--mute);margin-top:2px}

/* panel */
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;position:relative;margin-bottom:20px}
.panel::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--sky),var(--teal))}
.panel-title{color:var(--teal);font-size:15px;font-weight:700;padding:14px 18px;border-bottom:1px solid #f0f2f5;display:flex;align-items:center;gap:9px}
.panel-title i{font-style:normal;width:28px;height:28px;border-radius:9px;background:#e6f6f4;display:flex;align-items:center;justify-content:center;font-size:14px}
.panel-body{padding:18px}

/* form */
.form{display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:12px;align-items:end}
.field label{display:block;color:#374151;font-size:13px;font-weight:600;margin-bottom:7px}
.field select,.field input{width:100%;padding:11px 14px;background:#f9fafb;border:1px solid #d1d5db;border-radius:12px;color:var(--ink);font-family:inherit;font-size:14px;outline:none;transition:.2s}
.field select:focus,.field input:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(14,165,233,.15);background:#fff}

/* buttons */
.btn{padding:11px 20px;border:0;border-radius:30px;background:linear-gradient(135deg,#22c55e,var(--green));color:#fff;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 6px 14px rgba(34,197,94,.3);transition:.2s;white-space:nowrap}
.btn:hover{transform:translateY(-2px)}
.btn.danger{background:var(--red);box-shadow:none;padding:8px 16px;font-size:12.5px}
.btn.danger:hover{background:#b91c1c}

/* days */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-bottom:22px}
.day{padding:14px 8px;background:#f8fafc;border:1px solid var(--line);border-radius:14px;text-align:center;cursor:pointer;font-weight:700;font-size:14px;color:#374151;transition:.2s}
.day small{display:block;margin-top:4px;font-weight:600;font-size:12px;color:var(--mute)}
.day:hover{background:#f0f9ff;border-color:#bae6fd;transform:translateY(-2px);box-shadow:0 6px 16px rgba(14,165,233,.12)}
.day.active{background:linear-gradient(135deg,var(--sky),var(--sky-d));border-color:var(--sky-d);color:#fff;box-shadow:0 6px 16px rgba(14,165,233,.3)}
.day.active small{color:rgba(255,255,255,.85)}

/* slots */
.schedule-title{font-size:18px;font-weight:800;color:var(--ink);margin-bottom:4px}
.slot{display:flex;justify-content:space-between;align-items:center;background:#edf5fc;border:1px solid #dbe5ef;border-left:4px solid var(--sky);padding:13px 16px;border-radius:12px;margin-top:10px;transition:.2s;gap:10px}
.slot:hover{background:#e2effb;transform:translateX(3px)}
.slot-left{display:flex;align-items:center;gap:18px}
.time{color:var(--sky-d);font-weight:700;min-width:160px;font-size:14px}
.subject{font-weight:700;color:var(--ink)}
.empty{text-align:center;color:#9ca3af;padding:35px 10px;font-size:13.5px}

/* footer */
.footer{background:#fff;border-top:1px solid var(--line);padding:16px 28px;display:flex;justify-content:space-between;color:var(--mute);font-size:13px;margin-top:28px}
:focus-visible{outline:3px solid rgba(14,165,233,.5);outline-offset:2px}

@media(max-width:1000px){.form{grid-template-columns:1fr 1fr}.days{grid-template-columns:repeat(4,1fr)}}
@media(max-width:750px){
.top-header{padding:0 12px}.brand-name,.welcome-text,.top-icon:not(.dot){display:none}
.sidebar{width:56px}.side-item{width:42px;height:42px}.main{margin-left:56px}
.content{padding:16px 14px 6px}.page-title{font-size:23px}
.form{grid-template-columns:1fr}.days{grid-template-columns:repeat(2,1fr)}
.slot-left{flex-direction:column;align-items:flex-start;gap:4px}
.footer{padding:14px;flex-direction:column;gap:6px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top-header">
  <div class="brand">
    <div class="brand-logo">F</div>
    <div class="brand-name">Face<span>Attend</span></div>
  </div>
  <div class="top-right">
    <div class="top-icon">🏠</div>
    <div class="top-icon dot">🔔</div>
    <div class="welcome-text">Welcome <strong>Admin</strong></div>
    <div class="profile"><div class="profile-avatar">A</div><span>▼</span></div>
  </div>
</header>

<aside class="sidebar">
  <a class="side-item" href="dashboard.html" title="Dashboard">▦</a>
  <a class="side-item" href="students.html" title="Students">👨‍🎓</a>
  <a class="side-item active" href="calendar.html" title="Calendar">📅</a>
  <a class="side-item" href="take-attendance.html" title="Take Attendance">📷</a>
  <a class="side-item" href="attendance.html" title="Reports">📊</a>
  <div class="side-bottom"><a class="side-item" onclick="logout()" title="Logout">⚙</a></div>
</aside>

<main class="main">
<div class="content">

  <div class="page-head">
    <div class="page-title">Attendance Calendar</div>
    <div class="page-sub">Create multiple subject slots for each day</div>
  </div>

  <div class="panel">
    <div class="panel-title"><i>➕</i>Add Subject Slot</div>
    <div class="panel-body">
      <div class="form">
        <div class="field"><label for="day">Day</label>
          <select id="day">
            <option>Monday</option><option>Tuesday</option><option>Wednesday</option>
            <option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option>
          </select></div>
        <div class="field"><label for="subject">Subject</label>
          <select id="subject">
            <option>DE</option><option>ADB</option><option>PS_LAB</option><option>DL</option>
            <option>SOFT_SKILL</option><option>SEDP</option><option>TOC</option>
            <option>APTITUDE</option><option>SEDP_LAB</option>
          </select></div>
        <div class="field"><label for="startTime">Start Time</label>
          <input type="time" id="startTime"></div>
        <div class="field"><label for="endTime">End Time</label>
          <input type="time" id="endTime"></div>
        <button class="btn" onclick="addSlot()">+ Add Slot</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title"><i>🗓️</i>Weekly Schedule</div>
    <div class="panel-body">
      <div class="days" id="days"></div>
      <div class="schedule-title" id="scheduleTitle">Monday Schedule</div>
      <div id="slotList"></div>
    </div>
  </div>

</div>

<footer class="footer">
  <div>FaceAttend Attendance System</div>
  <div>© 2026 All Rights Reserved</div>
  <div>AI Attendance</div>
</footer>
</main>

<script>
const API = "http://localhost:5000/api";

if (!localStorage.getItem("token") || localStorage.getItem("role") !== "admin") {
    location.href = "login.html";
}

function headers(json = false) {
    const h = { Authorization: "Bearer " + localStorage.getItem("token") };
    if (json) h["Content-Type"] = "application/json";
    return h;
}

function logout() {
    localStorage.clear();
    location.href = "login.html";
}

function escapeHtml(v) {
    if (v === null || v === undefined) return "";
    return String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

let selectedDay = "Monday";
let schedules = [];
const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];

async function loadCalendar() {
    try {
        const response = await fetch(API + "/calendar", { headers: headers() });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message);
        schedules = data.slots;
        renderDays();
        renderSchedule();
    } catch (error) {
        alert(error.message);
    }
}

function renderDays() {
    document.getElementById("days").innerHTML = days.map(day => {
        const count = schedules.filter(s => s.day === day).length;
        return `<div class="day ${selectedDay === day ? "active" : ""}" onclick="selectDay('${day}')">
                    ${day}<small>${count} ${count === 1 ? "slot" : "slots"}</small>
                </div>`;
    }).join("");
}

function selectDay(day) {
    selectedDay = day;
    document.getElementById("day").value = day;
    renderDays();
    renderSchedule();
}

function renderSchedule() {
    const list = document.getElementById("slotList");
    document.getElementById("scheduleTitle").textContent = selectedDay + " Schedule";

    const slots = schedules
        .filter(s => s.day === selectedDay)
        .sort((a, b) => a.startTime.localeCompare(b.startTime));

    if (slots.length === 0) {
        list.innerHTML = `<div class="empty">No slots added for ${selectedDay}.</div>`;
        return;
    }

    list.innerHTML = slots.map(slot => `
        <div class="slot">
            <div class="slot-left">
                <div class="time">${formatTime(slot.startTime)} - ${formatTime(slot.endTime)}</div>
                <div class="subject">${escapeHtml(slot.subject)}</div>
            </div>
            <button class="btn danger" onclick="deleteSlot('${slot._id}')">Delete</button>
        </div>`).join("");
}

async function addSlot() {
    const day = document.getElementById("day").value;
    const subject = document.getElementById("subject").value;
    const startTime = document.getElementById("startTime").value;
    const endTime = document.getElementById("endTime").value;

    if (!startTime || !endTime) return alert("Please select start and end time.");
    if (startTime >= endTime) return alert("End time must be after start time.");

    try {
        const response = await fetch(API + "/calendar", {
            method: "POST",
            headers: headers(true),
            body: JSON.stringify({ day, subject, startTime, endTime })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message);

        selectedDay = day;
        document.getElementById("startTime").value = "";
        document.getElementById("endTime").value = "";
        loadCalendar();
    } catch (error) {
        alert(error.message);
    }
}

async function deleteSlot(id) {
    if (!confirm("Delete this slot?")) return;

    try {
        const response = await fetch(API + "/calendar/" + id, { method: "DELETE", headers: headers() });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message);
        loadCalendar();
    } catch (error) {
        alert(error.message);
    }
}

function formatTime(time) {
    let [h, m] = time.split(":");
    h = Number(h);
    const ampm = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    return h + ":" + m + " " + ampm;
}

loadCalendar();
</script>
</body>
</html>
