<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Take Attendance - FaceAttend</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:#0f172a;
    color:white;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    position:fixed;
    left:0;
    top:0;

    width:240px;
    height:100vh;

    background:#020617;
    border-right:1px solid #1e293b;

    padding:25px 15px;
}

.logo{
    font-size:25px;
    font-weight:bold;
    text-align:center;

    margin-bottom:35px;
}

.logo span{
    color:#3b82f6;
}

.nav a{
    display:block;

    color:#cbd5e1;
    text-decoration:none;

    padding:13px 15px;

    border-radius:8px;

    margin-bottom:7px;

    cursor:pointer;
}

.nav a:hover,
.nav a.active{
    background:#1e293b;
    color:white;
}

.nav .logout{
    margin-top:30px;
    color:#f87171;
}

/* =========================
   MAIN
========================= */

.main{
    margin-left:240px;

    min-height:100vh;

    padding:35px;
}

.header{
    margin-bottom:25px;
}

.header h1{
    font-size:30px;
}

.header p{
    color:#94a3b8;
    margin-top:7px;
}

/* =========================
   PANEL
========================= */

.panel{
    background:#1e293b;

    border:1px solid #334155;

    border-radius:15px;

    padding:25px;

    margin-bottom:20px;
}

/* =========================
   CAMERA
========================= */

.camera-box{
    text-align:center;
}

video{
    width:100%;
    max-width:760px;

    height:430px;

    object-fit:cover;

    background:#020617;

    border:1px solid #334155;

    border-radius:14px;

    display:block;

    margin:auto;
}

/* =========================
   BUTTONS
========================= */

.btn{
    padding:12px 18px;

    border:0;

    border-radius:8px;

    background:#2563eb;

    color:white;

    font-weight:bold;

    cursor:pointer;

    margin-top:18px;
}

.btn:hover{
    background:#1d4ed8;
}

.danger{
    background:#7f1d1d;
    margin-left:8px;
}

.danger:hover{
    background:#991b1b;
}

/* =========================
   STATUS
========================= */

.status{
    margin-top:15px;
    color:#94a3b8;
}

.success{
    color:#86efac;
}

.warning{
    color:#fde68a;
}

.result{
    padding:15px;

    background:#0f172a;

    border:1px solid #334155;

    border-radius:10px;

    margin-top:15px;

    min-height:60px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:700px){

    .sidebar{
        position:static;

        width:100%;

        height:auto;
    }

    .main{
        margin-left:0;
    }

    video{
        height:300px;
    }

}

</style>

</head>


<body>


<!-- =========================================
     SIDEBAR
========================================= -->

<div class="sidebar">

    <div class="logo">
        Face<span>Attend</span>
    </div>


    <div class="nav">

        <a href="dashboard.html">
            🏠 Dashboard
        </a>


        <a href="students.html">
            👨‍🎓 Students
        </a>


        <a href="calendar.html">
            📅 Calendar
        </a>


        <a href="take-attendance.html"
           class="active">

            📷 Take Attendance

        </a>


        <a href="attendance.html">
            📊 Reports
        </a>


        <a class="logout"
           onclick="logout()">

            ↪ Logout

        </a>

    </div>

</div>



<!-- =========================================
     MAIN
========================================= -->

<div class="main">


    <div class="header">

        <h1>
            Take Attendance
        </h1>

        <p>
            AI Face Recognition Attendance
        </p>

    </div>



    <!-- =====================================
         ACTIVE CLASS
    ====================================== -->

    <div class="panel">

        <h2>
            Current Class
        </h2>

        <div
            id="activeClass"
            class="status">

            Checking current class...

        </div>

    </div>



    <!-- =====================================
         CAMERA
    ====================================== -->

    <div class="panel">

        <div class="camera-box">

            <video
                id="video"
                autoplay
                muted
                playsinline>
            </video>


            <div>

                <button
                    id="startBtn"
                    class="btn"
                    onclick="startCamera()">

                    ▶ Start Camera

                </button>


                <button
                    id="stopBtn"
                    class="btn danger"
                    onclick="stopCamera()"
                    disabled>

                    ■ Stop Camera

                </button>

            </div>


            <div
                id="cameraStatus"
                class="status">

                Camera stopped

            </div>


            <div
                id="result"
                class="result">

                Waiting for camera...

            </div>

        </div>

    </div>

</div>



<script>

/* ==========================================
   API
========================================== */

const API =
    "http://localhost:5000/api";


/* ==========================================
   AUTH CHECK
========================================== */

if(
    !localStorage.getItem("token") ||
    localStorage.getItem("role") !== "admin"
){

    location.href =
        "login.html";

}


/* ==========================================
   LOGOUT
========================================== */

function logout(){

    localStorage.clear();

    location.href =
        "login.html";

}


/* ==========================================
   HEADERS
========================================== */

function headers(){

    return {

        Authorization:
            "Bearer " +
            localStorage.getItem("token")

    };

}


/* ==========================================
   VARIABLES
========================================== */

let stream = null;

let activeSubject = null;

let running = false;

let sessionCount = 0;

let recognizing = false;

let livenessRunning = false;

let challengeSequence = [];

let challengeIndex = 0;


/* ==========================================
   WAIT
========================================== */

function wait(ms){

    return new Promise(
        resolve => setTimeout(resolve, ms)
    );

}


/* ==========================================
   LOAD ACTIVE CLASS
========================================== */

async function loadActiveClass(){

    try{

        const response =
            await fetch(
                API + "/calendar/active",
                {
                    headers:headers()
                }
            );


        const data =
            await response.json();


        if(
            data.success &&
            data.active
        ){

            activeSubject =
                data.slot.subject;


            document
                .getElementById("activeClass")
                .innerHTML = `

                    <span class="success">

                        📚 ${data.slot.subject}

                    </span>

                    <br>

                    <span style="color:#94a3b8">

                        ${data.slot.startTime}
                        -
                        ${data.slot.endTime}

                    </span>

                `;

        }

        else{

            activeSubject = null;


            document
                .getElementById("activeClass")
                .innerHTML = `

                    <span class="warning">

                        ⚠ No active class right now

                    </span>

                `;

        }

    }

    catch(error){

        console.log(
            "Active class error:",
            error
        );

        document
            .getElementById("activeClass")
            .innerHTML = `

                <span class="warning">

                    Unable to load current class

                </span>

            `;

    }

}


/* ==========================================
   START CAMERA
========================================== */

async function startCamera(){

    await loadActiveClass();


    if(!activeSubject){

        alert(
            "There is no active class right now."
        );

        return;

    }


    try{

        stream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:"user"
                },

                audio:false

            });


        const video =
            document.getElementById("video");


        video.srcObject =
            stream;


        running = true;


        document
            .getElementById("startBtn")
            .disabled = true;


        document
            .getElementById("stopBtn")
            .disabled = false;


        document
            .getElementById("cameraStatus")
            .innerHTML = `

                <span class="success">

                    🟢 Camera running

                </span>

            `;


        document
            .getElementById("result")
            .innerHTML = `

                Looking for student...

            `;


        startRecognitionLoop();

    }

    catch(error){

        console.log(
            "Camera error:",
            error
        );


        alert(
            "Camera permission required."
        );

    }

}


/* ==========================================
   STOP CAMERA
========================================== */

function stopCamera(){

    running = false;

    recognizing = false;

    livenessRunning = false;


    if(stream){

        stream
            .getTracks()
            .forEach(
                track => track.stop()
            );

        stream = null;

    }


    document
        .getElementById("video")
        .srcObject = null;


    document
        .getElementById("startBtn")
        .disabled = false;


    document
        .getElementById("stopBtn")
        .disabled = true;


    document
        .getElementById("cameraStatus")
        .innerHTML = `

            Camera stopped

        `;


    document
        .getElementById("result")
        .innerHTML = `

            Camera stopped.

        `;

}


/* ==========================================
   CAPTURE FRAME
========================================== */

async function captureFrame(){

    const video =
        document.getElementById("video");


    if(
        !video ||
        video.readyState < 2
    ){

        return null;

    }


    const canvas =
        document.createElement("canvas");


    canvas.width =
        video.videoWidth;


    canvas.height =
        video.videoHeight;


    const ctx =
        canvas.getContext("2d");


    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );


    return new Promise(
        resolve => {

            canvas.toBlob(
                blob => resolve(blob),
                "image/jpeg",
                0.85
            );

        }
    );

}


/* ==========================================
   FACE RECOGNITION LOOP
========================================== */

async function startRecognitionLoop(){

    while(running){

        if(
            recognizing ||
            livenessRunning
        ){

            await wait(300);

            continue;

        }


        recognizing = true;


        try{

            const frame =
                await captureFrame();


            if(!frame){

                recognizing = false;

                await wait(500);

                continue;

            }


            const formData =
                new FormData();


            formData.append(
                "image",
                frame,
                "frame.jpg"
            );


            const response =
                await fetch(
                    API + "/attendance/recognize",
                    {
                        method:"POST",

                        headers:headers(),

                        body:formData
                    }
                );


            const data =
                await response.json();


            /* =========================
               FACE RECOGNIZED
            ========================= */

            if(
                data.success &&
                data.student
            ){

                const student =
                    data.student;


                const confidence =
                    data.confidence;


                document
                    .getElementById("result")
                    .innerHTML = `

                        <span class="success">

                            ✓ Face Recognized

                        </span>

                        <br><br>

                        <strong>

                            ${escapeHtml(student.name)}

                        </strong>

                        <br>

                        ID:
                        ${escapeHtml(student.userId)}

                        <br><br>

                        Starting liveness check...

                    `;


                await wait(800);


                /*
                    RUN EASY LIVENESS
                */

                const livenessPassed =
                    await runLiveness();


                /*
                    MARK ATTENDANCE
                */

                if(livenessPassed){

                    await markAttendance(
                        student.userId,
                        confidence,
                        true
                    );


                    await wait(2500);

                }

            }


            /* =========================
               FACE NOT RECOGNIZED
            ========================= */

            else if(
                data.message ===
                "Face not recognized"
            ){

                document
                    .getElementById("result")
                    .innerHTML = `

                        <span class="warning">

                            ⚠ Face not recognized

                        </span>

                    `;

            }


            /* =========================
               OTHER MESSAGE
            ========================= */

            else{

                document
                    .getElementById("result")
                    .innerHTML = `

                        <span class="status">

                            ${escapeHtml(
                                data.message ||
                                "Looking for face..."
                            )}

                        </span>

                    `;

            }

        }

        catch(error){

            console.log(
                "Recognition error:",
                error
            );

        }


        recognizing = false;


        await wait(1000);

    }

}


/* ==========================================
   EASY RANDOM CHALLENGE
========================================== */

function createChallenge(){

    const actions = [

        "blink",
        "left",
        "right"

    ];


    /*
       ONLY ONE ACTION
    */

    const randomIndex =
        Math.floor(
            Math.random() *
            actions.length
        );


    challengeSequence = [

        actions[randomIndex]

    ];


    challengeIndex = 0;

}


/* ==========================================
   PERFORM LIVENESS ACTION
========================================== */

async function performLivenessAction(
    action
){

    let instruction = "";

    let detail = "";


    /* =====================================
       BLINK
    ====================================== */

    if(action === "blink"){

        instruction =
            "👁️ EK BAAR BLINK KARO";

        detail =
            "Normal blink karo";

    }


    /* =====================================
       LEFT
    ====================================== */

    if(action === "left"){

        instruction =
            "⬅️ THODA LEFT DEKHO";

        detail =
            "Bas halka sa left dekho";

    }


    /* =====================================
       RIGHT
    ====================================== */

    if(action === "right"){

        instruction =
            "➡️ THODA RIGHT DEKHO";

        detail =
            "Bas halka sa right dekho";

    }


    /* =====================================
       SHOW INSTRUCTION
    ====================================== */

    document
        .getElementById("result")
        .innerHTML = `

            <span
                class="warning"
                style="font-size:20px;"
            >

                ${instruction}

            </span>

            <br><br>

            <span style="color:#94a3b8">

                ${detail}

            </span>

            <br><br>

            Liveness checking...

        `;


    /* =====================================
       FORM DATA
    ====================================== */

    const formData =
        new FormData();


    /*
       CAPTURE 20 FRAMES

       20 × 150ms
       ≈ 3 seconds
    */

    for(
        let i = 0;
        i < 20;
        i++
    ){

        if(!running){

            return false;

        }


        const frame =
            await captureFrame();


        if(frame){

            formData.append(
                "images",
                frame,
                `frame-${i}.jpg`
            );

        }


        await wait(150);

    }


    /* =====================================
       ACTION
    ====================================== */

    formData.append(
        "action",
        action
    );


    /* =====================================
       SEND TO PYTHON
    ====================================== */

    try{

        const response =
            await fetch(
                "http://127.0.0.1:8000/liveness",
                {
                    method:"POST",

                    body:formData
                }
            );


        const data =
            await response.json();


        console.log(
            "Liveness response:",
            data
        );


        if(
            data.success &&
            data.passed
        ){

            return true;

        }


        return false;

    }

    catch(error){

        console.log(
            "Liveness error:",
            error
        );


        return false;

    }

}


/* ==========================================
   RUN LIVENESS
========================================== */

async function runLiveness(){

    if(livenessRunning){

        return false;

    }


    livenessRunning = true;


    /*
       CREATE ONLY ONE
       RANDOM CHALLENGE
    */

    createChallenge();


    console.log(
        "Liveness challenge:",
        challengeSequence
    );


    for(
        let i = 0;
        i < challengeSequence.length;
        i++
    ){

        if(!running){

            livenessRunning = false;

            return false;

        }


        const action =
            challengeSequence[i];


        challengeIndex = i;


        const passed =
            await performLivenessAction(
                action
            );


        if(!passed){

            document
                .getElementById("result")
                .innerHTML = `

                    <span class="warning">

                        ❌ Liveness failed

                    </span>

                    <br><br>

                    Please try again.

                `;


            livenessRunning = false;


            return false;

        }


        await wait(300);

    }


    /* =====================================
       SUCCESS
    ====================================== */

    document
        .getElementById("result")
        .innerHTML = `

            <span class="success">

                ✓ Liveness Verified

            </span>

            <br><br>

            Real person detected.

        `;


    livenessRunning = false;


    return true;

}


/* ==========================================
   MARK ATTENDANCE
========================================== */

async function markAttendance(
    studentId,
    confidence,
    livenessPassed
){

    try{

        const response =
            await fetch(
                API + "/attendance/mark",
                {
                    method:"POST",

                    headers:{
                        ...headers(),

                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        studentId:
                            studentId,

                        subject:
                            activeSubject,

                        confidence:
                            confidence,

                        livenessPassed:
                            livenessPassed

                    })

                }
            );


        const data =
            await response.json();


        if(data.success){

            document
                .getElementById("result")
                .innerHTML = `

                    <span
                        class="success"
                        style="font-size:22px;"
                    >

                        ✓ Attendance Marked

                    </span>

                    <br><br>

                    ${escapeHtml(
                        data.message ||
                        "Student marked Present"
                    )}

                `;

            sessionCount++;

        }

        else{

            document
                .getElementById("result")
                .innerHTML = `

                    <span class="warning">

                        ⚠
                        ${escapeHtml(
                            data.message ||
                            "Unable to mark attendance"
                        )}

                    </span>

                `;

        }

    }

    catch(error){

        console.log(
            "Attendance error:",
            error
        );


        document
            .getElementById("result")
            .innerHTML = `

                <span class="warning">

                    Attendance server error

                </span>

            `;

    }

}


/* ==========================================
   HTML ESCAPE
========================================== */

function escapeHtml(value){

    if(value === null ||
       value === undefined){

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* ==========================================
   INITIAL LOAD
========================================== */

loadActiveClass();


/*
   Refresh active class every minute
*/

setInterval(
    loadActiveClass,
    60000
);

</script>

</body>

</html>
