<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Take Attendance - FaceAttend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--sky:#0ea5e9;--sky-d:#0284c7;--teal:#009688;--dark:#1f2937;--ink:#111827;--mute:#6b7280;--line:#e5e7eb;--bg:#f1f5f9;--green:#16a34a;--red:#dc2626;--yellow:#facc15;--r:16px;--sh:0 1px 2px rgba(15,23,42,.04),0 6px 20px rgba(15,23,42,.06)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Plus Jakarta Sans",Arial,Helvetica,sans-serif;background:var(--bg);color:#222;display:flex;flex-direction:column;min-height:100vh;
background-image:radial-gradient(900px 380px at 85% -80px,rgba(14,165,233,.14),transparent 70%),radial-gradient(700px 320px at 10% -60px,rgba(0,150,136,.10),transparent 70%);background-repeat:no-repeat}

/* header */
.top-header{height:68px;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:fixed;inset:0 0 auto 0;z-index:1000}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#38bdf8,var(--sky-d));display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:800;box-shadow:0 6px 14px rgba(14,165,233,.35)}
.brand-name{font-size:21px;font-weight:800;color:var(--ink);letter-spacing:-.3px}
.brand-name span{color:var(--sky)}
.top-right{display:flex;align-items:center;gap:14px}
.top-icon{width:40px;height:40px;border-radius:12px;background:#f3f4f6;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;transition:.2s;position:relative}
.top-icon:hover{background:#e0f2fe;transform:translateY(-1px)}
.top-icon.dot::after{content:"";position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid #fff}
.welcome-text{font-size:14px;color:#374151;padding:0 6px}
.welcome-text strong{color:var(--red)}
.profile{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:30px;background:#f3f4f6;font-size:11px;color:var(--mute)}
.profile-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--sky),var(--teal));display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:15px}

/* sidebar */
.sidebar{position:fixed;top:68px;left:0;bottom:0;width:76px;background:var(--dark);z-index:900;display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:8px}
.side-item{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#d1d5db;text-decoration:none;font-size:21px;cursor:pointer;position:relative;transition:.2s}
.side-item:hover{background:#374151;color:#fff;transform:translateX(2px)}
.side-item.active{background:var(--yellow);color:var(--ink);box-shadow:0 6px 16px rgba(250,204,21,.35)}
.side-item.active::before{content:"";position:absolute;left:-13px;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--yellow)}
.side-item[title]:hover::after{content:attr(title);position:absolute;left:62px;background:var(--ink);color:#fff;font-size:12px;padding:5px 10px;border-radius:8px;white-space:nowrap;pointer-events:none}
.side-bottom{margin-top:auto}

/* main */
.main{margin-left:76px;padding-top:68px;flex:1;display:flex;flex-direction:column;min-width:0}
.content{flex:1;padding:24px 28px 8px;width:100%}
.page-head{margin-bottom:20px}
.page-title{font-size:28px;font-weight:800;color:var(--ink);letter-spacing:-.5px}
.page-sub{font-size:13.5px;color:var(--mute);margin-top:2px}

/* panel */
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;position:relative;margin-bottom:20px}
.panel::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--sky),var(--teal))}
.panel-title{color:var(--teal);font-size:15px;font-weight:700;padding:14px 18px;border-bottom:1px solid #f0f2f5;display:flex;align-items:center;gap:9px}
.panel-title i{font-style:normal;width:28px;height:28px;border-radius:9px;background:#e6f6f4;display:flex;align-items:center;justify-content:center;font-size:14px}
.panel-body{padding:18px}

/* current class */
.status{color:var(--mute);font-size:14px}
.success{color:var(--green);font-weight:700}
.warning{color:#b45309;font-weight:700}
.class-card{background:#edf5fc;border:1px solid #dbe5ef;border-left:4px solid var(--teal);border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.class-card .subj{font-weight:800;color:var(--ink);font-size:17px}
.class-card .time{color:var(--sky-d);font-weight:700;font-size:13px}
.notice{background:#fef3c7;border-radius:12px;padding:12px 16px;color:#b45309;font-weight:700;font-size:14px}

/* camera */
.camera-box{text-align:center}
.video-frame{max-width:760px;margin:auto;border-radius:14px;overflow:hidden;border:1px solid #d6e8f8;background:linear-gradient(180deg,#eef6fe,#e3effb);padding:8px}
video{width:100%;height:430px;object-fit:cover;background:#0f172a;border-radius:10px;display:block}
.actions{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{padding:11px 22px;border:0;border-radius:30px;background:linear-gradient(135deg,#22c55e,var(--green));color:#fff;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 6px 14px rgba(34,197,94,.3);transition:.2s}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn.danger{background:var(--red);box-shadow:0 6px 14px rgba(220,38,38,.25)}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
#cameraStatus{margin-top:14px}
.result{max-width:760px;margin:14px auto 0;padding:16px;background:#f8fafc;border:1px solid var(--line);border-radius:14px;min-height:64px;color:#374151;font-size:14px;line-height:1.5}

/* footer */
.footer{background:#fff;border-top:1px solid var(--line);padding:16px 28px;display:flex;justify-content:space-between;color:var(--mute);font-size:13px;margin-top:28px}
:focus-visible{outline:3px solid rgba(14,165,233,.5);outline-offset:2px}

@media(max-width:750px){
.top-header{padding:0 12px}.brand-name,.welcome-text,.top-icon:not(.dot){display:none}
.sidebar{width:56px}.side-item{width:42px;height:42px}.main{margin-left:56px}
.content{padding:16px 14px 6px}.page-title{font-size:23px}
video{height:300px}
.footer{padding:14px;flex-direction:column;gap:6px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top-header">
  <div class="brand">
    <div class="brand-logo">F</div>
    <div class="brand-name">Face<span>Attend</span></div>
  </div>
  <div class="top-right">
    <div class="top-icon">🏠</div>
    <div class="top-icon dot">🔔</div>
    <div class="welcome-text">Welcome <strong>Admin</strong></div>
    <div class="profile"><div class="profile-avatar">A</div><span>▼</span></div>
  </div>
</header>

<aside class="sidebar">
  <a class="side-item" href="dashboard.html" title="Dashboard">▦</a>
  <a class="side-item" href="students.html" title="Students">👨‍🎓</a>
  <a class="side-item" href="calendar.html" title="Calendar">📅</a>
  <a class="side-item active" href="take-attendance.html" title="Take Attendance">📷</a>
  <a class="side-item" href="attendance.html" title="Reports">📊</a>
  <div class="side-bottom"><a class="side-item" onclick="logout()" title="Logout">⚙</a></div>
</aside>

<main class="main">
<div class="content">

  <div class="page-head">
    <div class="page-title">Take Attendance</div>
    <div class="page-sub">AI Face Recognition Attendance</div>
  </div>

  <div class="panel">
    <div class="panel-title"><i>📚</i>Current Class</div>
    <div class="panel-body">
      <div id="activeClass" class="status">Checking current class...</div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title"><i>📷</i>Face Recognition</div>
    <div class="panel-body camera-box">
      <div class="video-frame">
        <video id="video" autoplay muted playsinline></video>
      </div>

      <div class="actions">
        <button id="startBtn" class="btn" onclick="startCamera()">▶ Start Camera</button>
        <button id="stopBtn" class="btn danger" onclick="stopCamera()" disabled>■ Stop Camera</button>
      </div>

      <div id="cameraStatus" class="status">Camera stopped</div>
      <div id="result" class="result">Waiting for camera...</div>
    </div>
  </div>

</div>

<footer class="footer">
  <div>FaceAttend Attendance System</div>
  <div>© 2026 All Rights Reserved</div>
  <div>AI Attendance</div>
</footer>
</main>

<script>
const API = "http://localhost:5000/api";

if (!localStorage.getItem("token") || localStorage.getItem("role") !== "admin") {
    location.href = "login.html";
}

function logout() {
    localStorage.clear();
    location.href = "login.html";
}

function headers() {
    return { Authorization: "Bearer " + localStorage.getItem("token") };
}

let stream = null;
let activeSubject = null;
let running = false;
let sessionCount = 0;
let recognizing = false;
let livenessRunning = false;
let challengeSequence = [];
let challengeIndex = 0;

function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

function escapeHtml(value) {
    if (value === null || value === undefined) return "";
    return String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

// LOAD ACTIVE CLASS
async function loadActiveClass() {
    const box = document.getElementById("activeClass");
    try {
        const response = await fetch(API + "/calendar/active", { headers: headers() });
        const data = await response.json();

        if (data.success && data.active) {
            activeSubject = data.slot.subject;
            box.innerHTML = `
                <div class="class-card">
                    <div class="subj">📚 ${escapeHtml(data.slot.subject)}</div>
                    <div class="time">${escapeHtml(data.slot.startTime)} - ${escapeHtml(data.slot.endTime)}</div>
                </div>`;
        } else {
            activeSubject = null;
            box.innerHTML = `<div class="notice">⚠ No active class right now</div>`;
        }
    } catch (error) {
        console.log("Active class error:", error);
        box.innerHTML = `<div class="notice">Unable to load current class</div>`;
    }
}

// START CAMERA
async function startCamera() {
    await loadActiveClass();

    if (!activeSubject) {
        alert("There is no active class right now.");
        return;
    }

    try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
        document.getElementById("video").srcObject = stream;
        running = true;

        document.getElementById("startBtn").disabled = true;
        document.getElementById("stopBtn").disabled = false;
        document.getElementById("cameraStatus").innerHTML = `<span class="success">🟢 Camera running</span>`;
        document.getElementById("result").innerHTML = "Looking for student...";

        startRecognitionLoop();
    } catch (error) {
        console.log("Camera error:", error);
        alert("Camera permission required.");
    }
}

// STOP CAMERA
function stopCamera() {
    running = false;
    recognizing = false;
    livenessRunning = false;

    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
    }

    document.getElementById("video").srcObject = null;
    document.getElementById("startBtn").disabled = false;
    document.getElementById("stopBtn").disabled = true;
    document.getElementById("cameraStatus").innerHTML = "Camera stopped";
    document.getElementById("result").innerHTML = "Camera stopped.";
}

// CAPTURE FRAME
async function captureFrame() {
    const video = document.getElementById("video");
    if (!video || video.readyState < 2) return null;

    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);

    return new Promise(resolve => canvas.toBlob(blob => resolve(blob), "image/jpeg", 0.85));
}

// FACE RECOGNITION LOOP
async function startRecognitionLoop() {
    while (running) {
        if (recognizing || livenessRunning) {
            await wait(300);
            continue;
        }

        recognizing = true;

        try {
            const frame = await captureFrame();

            if (!frame) {
                recognizing = false;
                await wait(500);
                continue;
            }

            const formData = new FormData();
            formData.append("image", frame, "frame.jpg");

            const response = await fetch(API + "/attendance/recognize", {
                method: "POST",
                headers: headers(),
                body: formData
            });
            const data = await response.json();

            if (data.success && data.student) {
                const student = data.student;
                const confidence = data.confidence;

                document.getElementById("result").innerHTML = `
                    <span class="success">✓ Face Recognized</span><br><br>
                    <strong>${escapeHtml(student.name)}</strong><br>
                    ID: ${escapeHtml(student.userId)}<br><br>
                    Starting liveness check...`;

                await wait(800);

                const livenessPassed = await runLiveness();

                if (livenessPassed) {
                    await markAttendance(student.userId, confidence, true);
                    await wait(2500);
                }
            } else if (data.message === "Face not recognized") {
                document.getElementById("result").innerHTML = `<span class="warning">⚠ Face not recognized</span>`;
            } else {
                document.getElementById("result").innerHTML =
                    `<span class="status">${escapeHtml(data.message || "Looking for face...")}</span>`;
            }
        } catch (error) {
            console.log("Recognition error:", error);
        }

        recognizing = false;
        await wait(1000);
    }
}

// LIVENESS CHALLENGE
function createChallenge() {
    const actions = ["blink", "left", "right"];
    const randomIndex = Math.floor(Math.random() * actions.length);
    challengeSequence = [actions[randomIndex]];
    challengeIndex = 0;
}

async function performLivenessAction(action) {
    let instruction = "";
    let detail = "";

    if (action === "blink") {
        instruction = "👁️ EK BAAR BLINK KARO";
        detail = "Normal blink karo";
    }
    if (action === "left") {
        instruction = "⬅️ THODA LEFT DEKHO";
        detail = "Bas halka sa left dekho";
    }
    if (action === "right") {
        instruction = "➡️ THODA RIGHT DEKHO";
        detail = "Bas halka sa right dekho";
    }

    document.getElementById("result").innerHTML = `
        <span class="warning" style="font-size:20px;">${instruction}</span><br><br>
        <span class="status">${detail}</span><br><br>
        Liveness checking...`;

    const formData = new FormData();

    // 20 frames x 150ms = ~3 seconds
    for (let i = 0; i < 20; i++) {
        if (!running) return false;

        const frame = await captureFrame();
        if (frame) formData.append("images", frame, `frame-${i}.jpg`);

        await wait(150);
    }

    formData.append("action", action);

    try {
        const response = await fetch("http://127.0.0.1:8000/liveness", { method: "POST", body: formData });
        const data = await response.json();
        console.log("Liveness response:", data);
        return !!(data.success && data.passed);
    } catch (error) {
        console.log("Liveness error:", error);
        return false;
    }
}

async function runLiveness() {
    if (livenessRunning) return false;

    livenessRunning = true;
    createChallenge();
    console.log("Liveness challenge:", challengeSequence);

    for (let i = 0; i < challengeSequence.length; i++) {
        if (!running) {
            livenessRunning = false;
            return false;
        }

        challengeIndex = i;
        const passed = await performLivenessAction(challengeSequence[i]);

        if (!passed) {
            document.getElementById("result").innerHTML = `
                <span class="warning">❌ Liveness failed</span><br><br>
                Please try again.`;
            livenessRunning = false;
            return false;
        }

        await wait(300);
    }

    document.getElementById("result").innerHTML = `
        <span class="success">✓ Liveness Verified</span><br><br>
        Real person detected.`;

    livenessRunning = false;
    return true;
}

// MARK ATTENDANCE
async function markAttendance(studentId, confidence, livenessPassed) {
    try {
        const response = await fetch(API + "/attendance/mark", {
            method: "POST",
            headers: { ...headers(), "Content-Type": "application/json" },
            body: JSON.stringify({ studentId, subject: activeSubject, confidence, livenessPassed })
        });
        const data = await response.json();

        if (data.success) {
            document.getElementById("result").innerHTML = `
                <span class="success" style="font-size:22px;">✓ Attendance Marked</span><br><br>
                ${escapeHtml(data.message || "Student marked Present")}`;
            sessionCount++;
        } else {
            document.getElementById("result").innerHTML =
                `<span class="warning">⚠ ${escapeHtml(data.message || "Unable to mark attendance")}</span>`;
        }
    } catch (error) {
        console.log("Attendance error:", error);
        document.getElementById("result").innerHTML = `<span class="warning">Attendance server error</span>`;
    }
}

loadActiveClass();
setInterval(loadActiveClass, 60000);
</script>
</body>
</html>
